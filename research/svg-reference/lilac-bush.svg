<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Lilac Bush — top-down aerial view, PvZ-inspired -->
  <!-- Shadow -->
  <ellipse cx="64" cy="74" rx="36" ry="12" fill="#3A2A10" opacity="0.15"/>

  <!-- Base foliage mass -->
  <circle cx="64" cy="62" r="44" fill="#2E7D32" stroke="#3A2A10" stroke-width="2.5"/>

  <!-- Foliage bumps -->
  <circle cx="28" cy="50" r="14" fill="#388E3C" stroke="#3A2A10" stroke-width="2"/>
  <circle cx="42" cy="26" r="13" fill="#43A047" stroke="#3A2A10" stroke-width="2"/>
  <circle cx="72" cy="22" r="13" fill="#388E3C" stroke="#3A2A10" stroke-width="2"/>
  <circle cx="98" cy="38" r="13" fill="#43A047" stroke="#3A2A10" stroke-width="2"/>
  <circle cx="104" cy="66" r="13" fill="#2E7D32" stroke="#3A2A10" stroke-width="2"/>
  <circle cx="84" cy="94" r="12" fill="#1B5E20" stroke="#3A2A10" stroke-width="2"/>
