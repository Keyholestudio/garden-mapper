  <!-- florets -->
  <circle cx="38" cy="40" r="5" fill="#CE93D8" stroke="#3A2A10" stroke-width="1.5"/>
  <circle cx="48" cy="38" r="5" fill="#BA68C8" stroke="#3A2A10" stroke-width="1.5"/>
  <circle cx="54" cy="46" r="5" fill="#CE93D8" stroke="#3A2A10" stroke-width="1.5"/>
  <circle cx="50" cy="56" r="5" fill="#AB47BC" stroke="#3A2A10" stroke-width="1.5"/>
  <circle cx="38" cy="54" r="5" fill="#BA68C8" stroke="#3A2A10" stroke-width="1.5"/>
  <circle cx="32" cy="48" r="5" fill="#CE93D8" stroke="#3A2A10" stroke-width="1.5"/>
  <circle cx="44" cy="48" r="4" fill="#E1BEE7"/>

  <!-- Cluster 2 — right -->
  <ellipse cx="82" cy="48" rx="16" ry="19" fill="#6A1B9A" stroke="#3A2A10" stroke-width="2"/>
  <ellipse cx="82" cy="46" rx="12" ry="15" fill="#8E24AA"/>
  <circle cx="76" cy="40" r="5" fill="#CE93D8" stroke="#3A2A10" stroke-width="1.5"/>
  <circle cx="86" cy="38" r="5" fill="#BA68C8" stroke="#3A2A10" stroke-width="1.5"/>
  <circle cx="92" cy="46" r="5" fill="#CE93D8" stroke="#3A2A10" stroke-width="1.5"/>
  <circle cx="88" cy="56" r="5" fill="#AB47BC" stroke="#3A2A10" stroke-width="1.5"/>
  <circle cx="76" cy="54" r="5" fill="#BA68C8" stroke="#3A2A10" stroke-width="1.5"/>
  <circle cx="70" cy="48" r="5" fill="#CE93D8" stroke="#3A2A10" stroke-width="1.5"/>
  <circle cx="82" cy="48" r="4" fill="#E1BEE7"/>

  <!-- Cluster 3 — bottom centre -->
  <ellipse cx="63" cy="76" rx="17" ry="16" fill="#7B1FA2" stroke="#3A2A10" stroke-width="2"/>
  <ellipse cx="63" cy="74" rx="13" ry="12" fill="#9C27B0"/>
  <circle cx="57" cy="68" r="5" fill="#CE93D8" stroke="#3A2A10" stroke-width="1.5"/>
  <circle cx="68" cy="68" r="5" fill="#BA68C8" stroke="#3A2A10" stroke-width="1.5"/>
  <circle cx="74" cy="76" r="5" fill="#CE93D8" stroke="#3A2A10" stroke-width="1.5"/>
  <circle cx="68" cy="84" r="5" fill="#AB47BC" stroke="#3A2A10" stroke-width="1.5"/>
  <circle cx="56" cy="82" r="5" fill="#BA68C8" stroke="#3A2A10" stroke-width="1.5"/>
  <circle cx="52" cy="74" r="5" fill="#CE93D8" stroke="#3A2A10" stroke-width="1.5"/>
  <circle cx="63" cy="76" r="4" fill="#EDE7F6"/>

  <!-- Small bud top centre -->
  <ellipse cx="64" cy="34" rx="9" ry="11" fill="#8E24AA" stroke="#3A2A10" stroke-width="2"/>
