<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <!-- PWA: prevent browser zoom on double-tap, enable full-screen feel -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.json" />
    <!-- iOS home screen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Garden Mapper" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <!-- Theme colour (matches app green) -->
    <meta name="theme-color" content="#2D5016" />
    <title>Garden Mapper</title>
  </head>
  <body>
    <!-- Splash screen: shown instantly, faded out by main.tsx after app mounts -->
    <div id="splash" style="
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #1a3a0a url('/splash-web.jpg') center center / cover no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 1.2s ease;
    "></div>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
