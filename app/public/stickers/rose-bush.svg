<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Rose Bush — top-down aerial view, PvZ-inspired -->
  <!-- Shadow -->
  <ellipse cx="64" cy="72" rx="34" ry="14" fill="#3A2A10" opacity="0.16"/>

  <!-- Base foliage — dark green mass -->
  <circle cx="64" cy="62" r="42" fill="#388E3C" stroke="#3A2A10" stroke-width="2.5"/>

  <!-- Foliage detail bumps -->
  <circle cx="32" cy="48" r="14" fill="#43A047" stroke="#3A2A10" stroke-width="2"/>
  <circle cx="52" cy="28" r="13" fill="#43A047" stroke="#3A2A10" stroke-width="2"/>
  <circle cx="80" cy="26" r="12" fill="#388E3C" stroke="#3A2A10" stroke-width="2"/>
  <circle cx="98" cy="44" r="13" fill="#43A047" stroke="#3A2A10" stroke-width="2"/>
  <circle cx="98" cy="72" r="13" fill="#388E3C" stroke="#3A2A10" stroke-width="2"/>
  <circle cx="76" cy="92" r="12" fill="#2E7D32" stroke="#3A2A10" stroke-width="2"/>
  <circle cx="46" cy="90" r="12" fill="#2E7D32" stroke="#3A2A10" stroke-width="2"/>
  <circle cx="26" cy="70" r="13" fill="#33691E" stroke="#3A2A10" stroke-width="2"/>

  <!-- Roses — top-down bloom view -->
  <!-- Rose 1 (centre-left) -->
  <circle cx="50" cy="52" r="13" fill="#E53935" stroke="#3A2A10" stroke-width="2"/>
  <circle cx="50" cy="52" r="9" fill="#EF5350"/>
  <circle cx="50" cy="52" r="5" fill="#FFCDD2"/>
  <ellipse cx="43" cy="46" rx="5" ry="7" fill="#E53935" stroke="#3A2A10" stroke-width="1.5" transform="rotate(-30 43 46)"/>
  <ellipse cx="57" cy="46" rx="5" ry="7" fill="#C62828" stroke="#3A2A10" stroke-width="1.5" transform="rotate(30 57 46)"/>
  <ellipse cx="43" cy="58" rx="5" ry="7" fill="#C62828" stroke="#3A2A10" stroke-width="1.5" transform="rotate(30 43 58)"/>
  <ellipse cx="57" cy="58" rx="5" ry="7" fill="#E53935" stroke="#3A2A10" stroke-width="1.5" transform="rotate(-30 57 58)"/>

  <!-- Rose 2 (right) -->
  <circle cx="80" cy="56" r="12" fill="#E91E63" stroke="#3A2A10" stroke-width="2"/>
  <circle cx="80" cy="56" r="8" fill="#F06292"/>
  <circle cx="80" cy="56" r="4" fill="#FCE4EC"/>
  <ellipse cx="73" cy="50" rx="4" ry="6" fill="#E91E63" stroke="#3A2A10" stroke-width="1.5" transform="rotate(-30 73 50)"/>
  <ellipse cx="87" cy="50" rx="4" ry="6" fill="#AD1457" stroke="#3A2A10" stroke-width="1.5" transform="rotate(30 87 50)"/>
  <ellipse cx="73" cy="62" rx="4" ry="6" fill="#AD1457" stroke="#3A2A10" stroke-width="1.5" transform="rotate(30 73 62)"/>
  <ellipse cx="87" cy="62" rx="4" ry="6" fill="#E91E63" stroke="#3A2A10" stroke-width="1.5" transform="rotate(-30 87 62)"/>

  <!-- Rose 3 (bottom centre) -->
  <circle cx="62" cy="78" r="11" fill="#E53935" stroke="#3A2A10" stroke-width="2"/>
  <circle cx="62" cy="78" r="7" fill="#EF9A9A"/>
  <circle cx="62" cy="78" r="3.5" fill="#FFEBEE"/>
  <ellipse cx="56" cy="73" rx="4" ry="6" fill="#E53935" stroke="#3A2A10" stroke-width="1.5" transform="rotate(-25 56 73)"/>
  <ellipse cx="68" cy="73" rx="4" ry="6" fill="#C62828" stroke="#3A2A10" stroke-width="1.5" transform="rotate(25 68 73)"/>
  <ellipse cx="56" cy="83" rx="4" ry="6" fill="#C62828" stroke="#3A2A10" stroke-width="1.5" transform="rotate(25 56 83)"/>
  <ellipse cx="68" cy="83" rx="4" ry="6" fill="#E53935" stroke="#3A2A10" stroke-width="1.5" transform="rotate(-25 68 83)"/>

  <!-- Small bud top right -->
  <circle cx="88" cy="36" r="7" fill="#E91E63" stroke="#3A2A10" stroke-width="2"/>
  <circle cx="88" cy="36" r="4" fill="#F48FB1"/>
</svg>
